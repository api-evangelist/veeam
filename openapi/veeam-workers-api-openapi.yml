components:
  schemas:
    RegionSettings:
      required:
      - regionId
      - cloudNetworkId
      - cloudSubnetworkId
      - cloudSecurityGroupId
      type: object
      properties:
        regionId:
          format: uuid
          type: string
        regionName:
          type: string
        parentReiognId:
          type: string
          format: uuid
        parentRegionName:
          type: string
        cloudNetworkId:
          type: string
        cloudNetworkName:
          type: string
        cloudSubnetworkId:
          type: string
        cloudSubnetworkName:
          type: string
        cloudSecurityGroupId:
          type: string
        cloudSecurityGroupName:
          type: string
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    Link:
      required:
      - rel
      - href
      - method
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
    RegionSettingsFilters:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    RegionTypes:
      enum:
      - Global
      - Emulator
      - Government
      - China
      type: string
    ServiceAccountSettings:
      required:
      - serviceAmazonAccountId
      type: object
      properties:
        serviceAmazonAccountId:
          format: uuid
          type: string
        serviceAmazonAccountName:
          type: string
        serviceAmazonAccountRegionType:
          $ref: '#/components/schemas/RegionTypes'
        serviceRegion:
          type: string
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    EmptySuccessResponse:
      description: Empty succes response ( 200, 201, 204 )
      type: object
    RegionSettingsSpec:
      required:
      - availableZoneId
      - cloudNetworkId
      - cloudSubnetworkId
      - cloudSecurityGroupId
      type: object
      properties:
        availableZoneId:
          format: uuid
          type: string
        cloudNetworkId:
          type: string
        cloudSubnetworkId:
          type: string
        cloudSecurityGroupId:
          type: string
    RegionSettingsPage:
      required:
      - totalCount
      - results
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        results:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/RegionSettings'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    Error:
      description: ''
      required:
      - type
      - title
      - status
      - errorCode
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An URI reference that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g. using HTML).
        title:
          type: string
          description: A short, summary of the problem type. Written in English and readable for engineers (usually not suited for non technical stakeholders and not localized)
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
        errorCode:
          description: The error code is a string that uniquely identifies an error condition and should be understood by programs that detect and handle errors by type
          enum:
          - AccessDenied
          - ExpiredToken
          - InvalidToken
          - InvalidURI
          - MethodNotAllowed
          - NotFound
          - NotImplemented
          - ServiceUnavailable
          - UnexpectedContent
          - UnknownError
          type: string
        details:
          description: The error message contains a generic description of the error condition in English. It is intended for a human audience
          type: string
        instance:
          description: ID of the object that is involved in the error (or empty)
          type: string
          format: uri
        data:
          type: object
          description: Error payload
          additionalProperties:
            type: object
  parameters:
    apiVersionParam:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        default: 1.0-rev0
  securitySchemes:
    Bearer:
      name: Authorization
      in: header
      type: apiKey
      description: Bearer \<JWT\>
