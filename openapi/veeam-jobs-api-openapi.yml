    post:
      description: The HTTP POST request to the `/api/v1/jobs/{id}/stop` path allows you to stop a job that has the specified `id`.
      operationId: StopJob
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      - description: ID of the job.
        in: path
        name: id
        required: true
        schema:
