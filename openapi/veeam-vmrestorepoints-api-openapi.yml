components:
  schemas:
    Link:
      required:
      - rel
      - href
      - method
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
    ValidationMessage:
      type: object
      properties:
        severity:
          enum:
          - Warning
          - Error
          type: string
        message:
          type: string
        contextId:
          type: string
          format: uuid
    JobTypes:
      enum:
      - Backup
      - Snapshot
      - ManualSnapshot
      - Replica
      type: string
    VmRestorePointsSortColumns:
      type: string
      enum:
      - pointInTimeAsc
      - pointInTimeDesc
      - backupSizeBytesAsc
      - backupSizeBytesDesc
      - jobTypeAsc
      - jobTypeDesc
    VmRestorePointsFilters:
      type: object
      properties:
        VirtualMachineId:
          type: string
          format: uuid
        OnlyLatest:
          type: boolean
        Offset:
          type: integer
          format: int32
          minimum: 0
        Limit:
          type: integer
          format: int32
          minimum: -1
        Sort:
          type: array
          items:
            $ref: '#/components/schemas/VmRestorePointsSortColumns'
          uniqueItems: false
    VirtualMachineRestoreOptions:
      type: object
      properties:
        reason:
          type: string
        amazonAccountId:
          type: string
          format: uuid
        accessKey:
          type: string
        secretKey:
          type: string
        startInstance:
          type: boolean
        toAlternative:
          $ref: '#/components/schemas/VirtualMachineToAlternativeRestoreOptions'
    StartFlrResponse:
      required:
      - sessionId
      - url
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        url:
          type: string
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    Error:
      description: ''
      required:
      - type
      - title
      - status
      - errorCode
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An URI reference that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g. using HTML).
        title:
          type: string
          description: A short, summary of the problem type. Written in English and readable for engineers (usually not suited for non technical stakeholders and not localized)
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
        errorCode:
          description: The error code is a string that uniquely identifies an error condition and should be understood by programs that detect and handle errors by type
          enum:
          - AccessDenied
          - ExpiredToken
          - InvalidToken
          - InvalidURI
          - MethodNotAllowed
          - NotFound
          - NotImplemented
          - ServiceUnavailable
          - UnexpectedContent
          - UnknownError
          type: string
        details:
          description: The error message contains a generic description of the error condition in English. It is intended for a human audience
          type: string
        instance:
          description: ID of the object that is involved in the error (or empty)
          type: string
          format: uri
        data:
          type: object
          description: Error payload
          additionalProperties:
            type: object
    FlrOptions:
      type: object
      properties:
        reason:
          type: string
    Ec2DiskTypes:
      type: string
      enum:
      - Standart
      - St1
      - Sc1
      - Io1
      - Gp2
    VirtualMachineToAlternativeRestoreOptions:
      required:
      - regionId
      - name
      - vmType
      - subnetId
      - networkSecurityGroupId
      - preserveEncryptionForVolumes
      type: object
      properties:
        name:
          type: string
        regionId:
          type: string
          format: uuid
        vmType:
          type: string
        subnetId:
          type: string
        networkSecurityGroupId:
          type: string
        preserveEncryptionForVolumes:
          type: boolean
        encryptionKeyId:
          type: string
    VmRestorePoint:
      required:
      - id
      - backupId
      - backupSizeBytes
      - jobType
      - pointInTime
      - volumes
      type: object
      properties:
        id:
          format: uuid
          type: string
        backupId:
          format: uuid
          type: string
        jobType:
          $ref: '#/components/schemas/JobTypes'
        pointInTime:
          format: date-time
          type: string
        backupSizeBytes:
          format: int64
          type: integer
        volumes:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/VmBackupVolume'
        regionId:
          format: uuid
          type: string
        availabilityZoneId:
          format: uuid
          type: string
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    SessionLink:
      required:
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    VmBackupVolume:
      required:
      - diskId
      - backupSizeBytes
      - type
      type: object
      properties:
        diskId:
          type: string
        type:
          $ref: '#/components/schemas/Ec2DiskTypes'
        backupSizeBytes:
          format: int64
          type: integer
        iops:
          format: int32
          type: integer
        name:
          type: string
        device:
          type: string
        encryptionKey:
          type: string
        encryptionKeyName:
          type: string
    DiskBulkRestoreOptions:
      required:
      - volumes
      type: object
      properties:
        reason:
          type: string
        amazonAccountId:
          type: string
          format: uuid
        accessKey:
          type: string
        secretKey:
          type: string
        volumes:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/DiskRestoreOptions'
        toAlternative:
          $ref: '#/components/schemas/DiskBulkRestoreToAlternativeOptions'
    DiskBulkRestoreToAlternativeOptions:
      required:
      - availabilityZoneId
      - preserveEncryptionForVolumes
      type: object
      properties:
        availabilityZoneId:
          type: string
          format: uuid
        preserveEncryptionForVolumes:
          type: boolean
        encryptionKeyId:
          type: string
    VmRestorePointsPage:
      required:
      - totalCount
      - results
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        results:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/VmRestorePoint'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    DiskRestoreOptions:
      required:
      - diskId
      type: object
      properties:
        diskId:
          type: string
        name:
          type: string
    VmRestorePointDefaultNetworkSettings:
      required:
      - restorePointId
      type: object
      properties:
        restorePointId:
          type: string
          format: uuid
        networkName:
          type: string
        networkId:
          type: string
        subNetworkName:
          type: string
        subNetworkId:
          type: string
        securityGroupName:
          type: string
        securityGroupId:
          type: string
  requestBodies:
    VirtualMachineRestoreOptions:
      content:
        application/json-patch+json:
          schema:
            $ref: '#/components/schemas/VirtualMachineRestoreOptions'
        application/json:
          schema:
            $ref: '#/components/schemas/VirtualMachineRestoreOptions'
        text/json:
          schema:
            $ref: '#/components/schemas/VirtualMachineRestoreOptions'
        application/*+json:
          schema:
            $ref: '#/components/schemas/VirtualMachineRestoreOptions'
        application/csp-report:
          schema:
            $ref: '#/components/schemas/VirtualMachineRestoreOptions'
    DiskBulkRestoreOptions:
      content:
        application/json-patch+json:
          schema:
            $ref: '#/components/schemas/DiskBulkRestoreOptions'
        application/json:
          schema:
            $ref: '#/components/schemas/DiskBulkRestoreOptions'
        text/json:
          schema:
            $ref: '#/components/schemas/DiskBulkRestoreOptions'
        application/*+json:
          schema:
            $ref: '#/components/schemas/DiskBulkRestoreOptions'
        application/csp-report:
          schema:
            $ref: '#/components/schemas/DiskBulkRestoreOptions'
  parameters:
    apiVersionParam:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        default: 1.0-rev0
  securitySchemes:
    Bearer:
      name: Authorization
      in: header
      type: apiKey
      description: Bearer \<JWT\>
