  /api/v1/vmRestorePoints/{vmRestorePointId}/restoreFile:
    post:
      tags:
      - VmRestorePoints
      operationId: startFlr
      parameters:
      - name: vmRestorePointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlrOptions'
      responses:
        '202':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StartFlrResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/StartFlrResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/StartFlrResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StartFlrResponse'
        '400':
          description: Bad Request. The request body is malformed, incomplete or otherwise invalid.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
