  /api/v1/vmRestorePoints/{vmRestorePointId}/defaultNetworkSettings:
    get:
      tags:
      - VmRestorePoints
      operationId: VmRestorePointsGetDefaultNetworkSettings
      parameters:
      - name: vmRestorePointId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/apiVersionParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
