openapi: 3.0.0
info:
  version: 1.0-rev0
  title: Veeam Backup for AWS public API 1.0 Agents VmRestorePoints API
  description: The Agents section defines paths and operations for managing recovery tokens used for bare metal recovery.
security:
- Bearer: []
tags:
- name: VmRestorePoints
paths:
  /api/v1/vmRestorePoints:
    get:
      tags:
      - VmRestorePoints
      operationId: RestorePointsGetAll
      parameters:
      - name: VirtualMachineId
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/VmRestorePointsFilters'
        schema:
          type: string
          format: uuid
      - name: Offset
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/VmRestorePointsFilters'
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: Limit
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/VmRestorePointsFilters'
        schema:
          type: integer
          format: int32
          minimum: -1
      - name: Sort
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/VmRestorePointsFilters'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - pointInTimeAsc
            - pointInTimeDesc
            - backupSizeBytesAsc
            - backupSizeBytesDesc
            - jobTypeAsc
            - jobTypeDesc
      - $ref: '#/components/parameters/apiVersionParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmRestorePointsPage'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VmRestorePointsPage'
        '400':
          description: Bad Request. The request body is malformed, incomplete or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. The authorization header has been expected but not found (or found but is expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error. The request has been received but could not be completed because of an internal error at the server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
