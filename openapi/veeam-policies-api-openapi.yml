openapi: 3.0.0
info:
  version: 1.0-rev0
  title: Veeam Backup for AWS public API 1.0 Agents Policies API
  description: The Agents section defines paths and operations for managing recovery tokens used for bare metal recovery.
security:
- Bearer: []
tags:
- name: Policies
paths:
  /api/v1/policies:
    get:
      tags:
      - Policies
      operationId: PoliciesGetAll
      parameters:
      - name: SearchPattern
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: string
      - name: VirtualMachineId
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: string
          format: uuid
      - name: LastPolicySessionStatus
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Running
            - NeverExecuted
            - Succeeded
            - Warning
            - Failed
            - Canceled
          uniqueItems: false
      - name: PolicyStatus
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Enabled
            - Disabled
          uniqueItems: false
      - name: Sort
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - priorityAsc
            - priorityDesc
            - nameAsc
            - nameDesc
            - usnAsc
            - usnDesc
      - name: Usn
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: integer
          format: int64
      - name: RepositoryId
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: string
          format: uuid
      - name: Offset
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: Limit
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/PoliciesFilters'
        schema:
          type: integer
          format: int32
          minimum: -1
      - $ref: '#/components/parameters/apiVersionParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliciesPage'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PoliciesPage'
        '400':
          description: Bad Request. The request body is malformed, incomplete or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. The authorization header has been expected but not found (or found but is expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error. The request has been received but could not be completed because of an internal error at the server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-veeam-authorize:
        roles:
        - Portal Administrator
        - Portal Operator
      tags:
      - Policies
      operationId: CreatePolicy
      parameters:
      - $ref: '#/components/parameters/apiVersionParam'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PolicySpec'
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySpec'
          text/json:
            schema:
              $ref: '#/components/schemas/PolicySpec'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PolicySpec'
          application/csp-report:
            schema:
              $ref: '#/components/schemas/PolicySpec'
      responses:
        '201':
          description: Success
          content:
            application/json:
