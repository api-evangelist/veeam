components:
  schemas:
    PolicyNotificationSettings:
      type: object
      properties:
        recipient:
          type: string
        notifyOnSuccess:
          type: boolean
        notifyOnWarning:
          type: boolean
        notifyOnFailure:
          type: boolean
    Link:
      required:
      - rel
      - href
      - method
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
    CostEstimationsPage:
      required:
      - totalCount
      - items
      - isEmpty
      - instancesCosts
      - totalTrafficCost
      - totalTransactionCost
      - totalCost
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        items:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/CostEstimationItem'
        isEmpty:
          type: boolean
        totalSnapshotCost:
          type: number
          format: double
        totalReplicaCost:
          type: number
          format: double
        totalBackupCost:
          type: number
          format: double
        totalTrafficCost:
          type: number
          format: double
        totalTransactionCost:
          type: number
          format: double
        totalCost:
          type: number
          format: double
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    WeeklyBackupScheduleSettings:
      type: object
      required:
      - retention
      - schedule
      properties:
        retention:
          $ref: '#/components/schemas/PeriodRetentionOptions'
        schedule:
          $ref: '#/components/schemas/WeeklySchedule'
    ValidationMessage:
      type: object
      properties:
        severity:
          enum:
          - Warning
          - Error
          type: string
        message:
          type: string
        contextId:
          type: string
          format: uuid
    PoliciesSortColumns:
      type: string
      enum:
      - priorityAsc
      - priorityDesc
      - nameAsc
      - nameDesc
      - usnAsc
      - usnDesc
    PolicySnapshotSettings:
      type: object
      properties:
        additionalTags:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/TagSpec'
        copyTagsFromVolumeEnabled:
          type: boolean
        tryCreateVSSSnapshot:
          type: boolean
    PolicyItemsSortColumns:
      type: string
      enum:
      - nameAsc
      - nameDesc
    SessionStatuses:
      type: string
      enum:
      - Running
      - NeverExecuted
      - Succeeded
      - Warning
      - Failed
      - Canceled
    MonthlyScheduleSettings:
      required:
      - timeLocal
      - dayNumberInMonth
      - snapshotOptions
      type: object
      properties:
        timeLocal:
          format: date-time
          type: string
        dayNumberInMonth:
          $ref: '#/components/schemas/DayNumbersInMonth'
        dayOfWeek:
          $ref: '#/components/schemas/DaysOfWeek'
        dayOfMonth:
          format: int32
          type: integer
        snapshotOptions:
          $ref: '#/components/schemas/MonthlySnapshotScheduleSettings'
        backupOptions:
          $ref: '#/components/schemas/MonthlyBackupScheduleSettings'
        replicaOptions:
          $ref: '#/components/schemas/MonthlyReplicaScheduleSettings'
    MonthlyBackupScheduleSettings:
      type: object
      required:
      - retention
      - schedule
      properties:
        retention:
          $ref: '#/components/schemas/PeriodRetentionOptions'
        schedule:
          $ref: '#/components/schemas/MonthlySchedule'
    MonthlySnapshotScheduleSettings:
      type: object
      required:
      - retention
      - schedule
      properties:
        retention:
          $ref: '#/components/schemas/PointsRetentionOptions'
        schedule:
          $ref: '#/components/schemas/MonthlySchedule'
    MonthlySchedule:
      type: object
      required:
      - months
      properties:
        months:
          type: array
          uniqueItems: true
          minLength: 0
          maxLength: 12
          items:
            $ref: '#/components/schemas/Months'
    Region:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    YearlyScheduleSettings:
      required:
      - timeLocal
      - dayNumberInMonth
      - month
      - retention
      type: object
      properties:
        timeLocal:
          type: string
          format: date-time
        dayNumberInMonth:
          $ref: '#/components/schemas/DayNumbersInMonth'
        dayOfWeek:
          $ref: '#/components/schemas/DaysOfWeek'
        dayOfMonth:
          format: int32
          type: integer
        month:
          $ref: '#/components/schemas/Months'
        retention:
          $ref: '#/components/schemas/YearlyRetentionOptions'
    Policy:
      required:
      - id
      - name
      - description
      - regionIds
      - priority
      - isEnabled
      - amazonAccountId
      - backupType
      type: object
      properties:
        id:
          format: uuid
          type: string
        snapshotSettings:
          $ref: '#/components/schemas/PolicySnapshotSettings'
        replicaSettings:
          $ref: '#/components/schemas/PolicyReplicaSettings'
        backupSettings:
          $ref: '#/components/schemas/PolicyBackupSettings'
        regionIds:
          minLength: 1
          uniqueItems: false
          type: array
          items:
            type: string
            format: uuid
        selectedItems:
          $ref: '#/components/schemas/PolicyBackupItems'
        excludedItems:
          $ref: '#/components/schemas/PolicyBackupItems'
        scheduleSettings:
          $ref: '#/components/schemas/ScheduleSettings'
        name:
          type: string
        description:
          type: string
        priority:
          format: int64
          type: integer
        amazonAccountId:
          type: string
          format: uuid
        retrySettings:
          $ref: '#/components/schemas/RetrySettings'
        policyNotificationSettings:
          $ref: '#/components/schemas/PolicyNotificationSettings'
        isEnabled:
          type: boolean
        backupType:
          $ref: '#/components/schemas/PolicySelectionTypes'
        createdBy:
          type: string
        modifiedBy:
          type: string
        lastPolicySessionStatus:
          $ref: '#/components/schemas/SessionStatuses'
        warning:
          type: string
        usn:
          format: int64
          type: integer
        _embeddedResources:
          $ref: '#/components/schemas/PolicyEmbeddedResources'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    RetentionTypes:
      type: string
      enum:
      - Days
      - Months
    DailyBackupScheduleSettings:
      type: object
      required:
      - retention
      - schedule
      properties:
        retention:
          $ref: '#/components/schemas/PeriodRetentionOptions'
        schedule:
          $ref: '#/components/schemas/DailySchedule'
    Error:
      description: ''
      required:
      - type
      - title
      - status
      - errorCode
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An URI reference that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g. using HTML).
        title:
          type: string
          description: A short, summary of the problem type. Written in English and readable for engineers (usually not suited for non technical stakeholders and not localized)
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
        errorCode:
          description: The error code is a string that uniquely identifies an error condition and should be understood by programs that detect and handle errors by type
          enum:
          - AccessDenied
          - ExpiredToken
          - InvalidToken
          - InvalidURI
          - MethodNotAllowed
          - NotFound
          - NotImplemented
          - ServiceUnavailable
          - UnexpectedContent
          - UnknownError
          type: string
        details:
          description: The error message contains a generic description of the error condition in English. It is intended for a human audience
          type: string
        instance:
          description: ID of the object that is involved in the error (or empty)
          type: string
          format: uri
        data:
          type: object
          description: Error payload
          additionalProperties:
            type: object
    PolicyEmbeddedResources:
      type: object
      properties:
        lastBackupSession:
          $ref: '#/components/schemas/Link'
        lastFinishedBackupSession:
          $ref: '#/components/schemas/Link'
        targetRepository:
          $ref: '#/components/schemas/Link'
        protectedResources:
          $ref: '#/components/schemas/Link'
        excludedResources:
          $ref: '#/components/schemas/Link'
        regions:
          $ref: '#/components/schemas/Link'
    Months:
      enum:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      type: string
    WeeklyScheduleSettings:
      required:
      - timeLocal
      - snapshotOptions
      type: object
      properties:
        timeLocal:
          format: date-time
          type: string
        snapshotOptions:
          $ref: '#/components/schemas/WeeklySnapshotScheduleSettings'
        backupOptions:
          $ref: '#/components/schemas/WeeklyBackupScheduleSettings'
        replicaOptions:
          $ref: '#/components/schemas/WeeklyReplicaScheduleSettings'
    EmptySuccessResponse:
      description: Empty succes response ( 200, 201, 204 )
      type: object
    YearlyRetentionOptions:
      required:
      - count
      - type
      type: object
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
        type:
          type: string
          enum:
          - Years
    PolicyBackupSettings:
      type: object
      properties:
        targetRepositoryId:
          format: uuid
          type: string
    PoliciesFilters:
      type: object
      properties:
        SearchPattern:
          type: string
        VirtualMachineId:
          type: string
          format: uuid
        LastPolicySessionStatus:
          type: array
          items:
            $ref: '#/components/schemas/SessionStatuses'
          uniqueItems: false
        PolicyStatus:
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatuses'
          uniqueItems: false
        Sort:
          type: array
          items:
            $ref: '#/components/schemas/PoliciesSortColumns'
          uniqueItems: false
        Usn:
          type: integer
          format: int64
        RepositoryId:
          type: string
          format: uuid
        Offset:
          type: integer
          format: int32
          minimum: 0
        Limit:
          type: integer
          format: int32
          minimum: -1
    DaysOfWeek:
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      type: string
    PolicySelectionTypes:
      enum:
      - AllItems
      - SelectedItems
      type: string
    DailySchedule:
      type: object
      required:
      - hours
      properties:
        hours:
          type: array
          uniqueItems: false
          minLength: 24
          maxLength: 24
          items:
            type: boolean
    RemoteMappingExportModel:
      required:
      - sourceRegionName
      - targetRegionName
      - targetAmazonAccountName
      type: object
      properties:
        sourceRegionName:
          type: string
        targetRegionName:
          type: string
        targetAmazonAccountName:
          type: string
        encryptionKey:
          type: string
    SessionLink:
      required:
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    PoliciesPrioritySpec:
      required:
      - priorities
      type: object
      properties:
        priorities:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/PolicyPrioritySpec'
    RetrySettings:
      required:
      - retryTimes
      type: object
      properties:
        retryTimes:
          format: int32
          type: integer
    PolicyItemsPage:
      required:
      - totalCount
      - results
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        results:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/PolicyItem'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    RegionsFilters:
      type: object
      properties:
        SearchPattern:
          type: string
        Offset:
          type: integer
          format: int32
          minimum: 0
        Limit:
          type: integer
          format: int32
          minimum: -1
        Sort:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/RegionsSortColumns'
    PolicyBackupItemsExportModel:
      type: object
      properties:
        virtualMachines:
          uniqueItems: false
          type: array
          items:
            type: string
        tags:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/TagSpec'
    PolicyBackupItems:
      type: object
      properties:
        virtualMachineIds:
          uniqueItems: false
          type: array
          items:
            type: string
            format: uuid
        tagIds:
          uniqueItems: false
          type: array
          items:
            type: string
            format: uuid
    WeeklySnapshotScheduleSettings:
      type: object
      required:
      - retention
      - schedule
      properties:
        retention:
          $ref: '#/components/schemas/PointsRetentionOptions'
        schedule:
          $ref: '#/components/schemas/WeeklySchedule'
    WeeklySchedule:
      type: object
      required:
      - days
      properties:
        days:
          type: array
          uniqueItems: true
          minLength: 0
          maxLength: 7
          items:
            $ref: '#/components/schemas/DaysOfWeek'
    RegionsPage:
      required:
      - totalCount
      - results
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        results:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/Region'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
