components:
  schemas:
    Link:
      required:
      - rel
      - href
      - method
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
    RetentionJobDeletedRestorePointsPage:
      required:
      - totalCount
      - results
      type: object
      properties:
        totalCount:
          format: int32
          type: integer
        results:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/RetentionJobDeletedRestorePoint'
        _links:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/Link'
    SessionLog:
      required:
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        log:
          uniqueItems: false
          type: array
          items:
            $ref: '#/components/schemas/LogItem'
    RestoredItemsFilters:
      type: object
      properties:
