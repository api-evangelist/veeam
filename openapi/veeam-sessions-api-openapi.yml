openapi: 3.0.0
info:
  version: 1.0-rev0
  title: Veeam Backup for AWS public API 1.0 Agents Sessions API
  description: The Agents section defines paths and operations for managing recovery tokens used for bare metal recovery.
security:
- Bearer: []
tags:
- name: Sessions
paths:
  /api/v1/sessions:
    get:
      tags:
      - Sessions
      operationId: GetSessions
      parameters:
      - name: Offset
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: Limit
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: integer
          format: int32
          minimum: -1
      - name: PolicyId
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: string
          format: uuid
      - name: Status
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - Running
            - NeverExecuted
            - Succeeded
            - Warning
            - Failed
            - Canceled
          uniqueItems: false
      - name: Types
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        explode: true
        schema:
          type: array
          items:
            enum:
            - Policy
            - Job
            - Task
            - UserPolicy
            - RetentionActivity
            - RestoreTask
            - FLRTask
            - SelfBackupActivity
            type: string
          uniqueItems: false
      - name: FromUtc
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: string
          format: date-time
      - name: ToUtc
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: string
          format: date-time
      - name: Usn
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: integer
          format: int64
      - name: Sort
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - startTimeAsc
            - startTimeDesc
            - stopTimeAsc
            - stopTimeDesc
            - durationAsc
            - durationDesc
            - typeAsc
            - typeDesc
            - reasonAsc
            - reasonDesc
            - usnAsc
            - usnDesc
          uniqueItems: false
      - name: VmId
        in: query
        required: false
        x-veeam-spec:
          $ref: '#/components/schemas/SessionsFilters'
        schema:
          type: string
      - $ref: '#/components/parameters/apiVersionParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsPage'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionsPage'
        '400':
          description: Bad Request. The request body is malformed, incomplete or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. The authorization header has been expected but not found (or found but is expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error. The request has been received but could not be completed because of an internal error at the server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
